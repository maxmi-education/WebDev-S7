{% extends 'base.html' %}

{%block content%}


<h1>Create Account</h1>
<div class="col-4 mx-3">
    <form id="form_register">
        <div class="form-group">
            <label for="first_name">First Name:</label>
            <input type="text" name="first_name" class="form-control" required />
        </div>

        <div class="form-group"> 
            <label for="last_name">Last Name:</label>
            <input type="text" name="last_name" class="form-control" required />
        </div>

        <div class="form-group"> 
            <label for="email">Email Address:</label>
            <input type="email" name="email" class="form-control" required />
        </div>

        <div class="form-group"> 
            <label for="password">Password:</label>
            <input type="password" name="password" class="form-control" id="password" required />
        </div>

        <div class="form-group"> 
            <label for="repeat_password">Repeat Password:</label>
            <input type="password" name="repeat_password" class="form-control" id="repeat_password" required />
            <p class="text-danger" id="password_check"></p>
        </div>

        <div class="form-group mt-2">
            <button type="submit" class="btn btn-primary" >Sign Up</button>
            <p class="text-danger" id="signup_error_message"></p>
            <p class="text-success" id="signup_success_message"></p>
        </div>

    </form>
</div>


{%endblock%}

{%block scripts%}
<script src="{{ url_for('static', filename='accounts.js') }}"></script>
{%endblock%}
