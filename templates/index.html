{% extends 'base.html' %}

{%block content%}


<h1>Hello from Flask!</h1>
<button id="clickMe">Click me</button>

<a href="/about"><button>About</button></a>
<div>

</div>
<div>
    <img src="/static/MV_Likoni_in_Mombasa.jpg" alt="Likoni in Mombasa" style="width:60%;height:auto">
</div>

<a href="/static/MV_Likoni_in_Mombasa.jpg" download="Likoni.jpg">Get the Image!</a>

<div>
    <form action="/api/insert_user" method="post">
        <label for="first_name">First name:</label><br>
        <input type="text" id="first_name" name="first_name" value="John"><br>
        <label for="last_name">Last name:</label><br>
        <input type="text" id="last_name" name="last_name" value="Doe"><br><br>
        <label for="email">Last name:</label><br>
        <input type="email" id="email" name="email" value="mail@example.com"><br><br>
        <input type="submit" value="Submit" id="submitButton">
    </form>
</div>

<div>
    <button class="btn btn-primary" id="showAllUsers">Show All Users</button>
    <h1>All Users</h1>

    <table id="usersTable" class="table">
        <thead>
            <tr id="headerRow">
                <th scope="col">#</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Email</th>
            </tr>
        </thead>
        <tbody id="bodyRows">
        </tbody>
    </table>
</div>

    <div class="comment-block">
        <h3>
            Comments
        </h3>
        <ul id="comment-container">
            Nothing here yet.
        </ul>
    </div>
    <div class="comment-form">
        <h3>Leave a Comment</h3>
        <form id="commentForm">
            <div class="form-group">
                <label for="authorName">Your Name:</label>
                <input type="text" name="author_name" id="authorName" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="commentMessage">Your Comment:</label>
                <textarea name="message" id="commentMessage" maxlength="500" required></textarea>
            </div>
            <button type="submit" id="submitComment" >Post Comment</button>
            <div id="commentFeedback"></div>
        </form>
    </div>
    <script src="{{ url_for('static', filename='comments.js') }}"></script>

    <!-- Toast Container (top-right corner) -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
            <strong class="me-auto">Notification</strong>
            <small>Just now</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
            <!-- Text will be added here with JavaScript -->
            </div>
        </div>
    </div>
{%endblock%}

{%block scripts%}
<script src="{{ url_for('static', filename='form.js') }}"></script>
{%endblock%}
